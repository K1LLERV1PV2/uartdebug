name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/markdown-runtime/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend --ignore-scripts

      - name: Audit runtime dependencies
        run: npm audit --prefix backend --omit=dev --audit-level=high

      - name: Install Markdown runtime dependencies
        run: npm ci --prefix frontend/markdown-runtime --ignore-scripts

      - name: Run tests
        run: npm test --prefix backend

      - name: Test vendored Markdown runtime
        run: |
          npm run build:check --prefix frontend/markdown-runtime
          npm test --prefix frontend/markdown-runtime

      - name: Check JavaScript syntax
        run: |
          npm run check --prefix backend
          node --check public/AVR-Programming.js
          node --check public/avr-mini-projects.js
          node --check public/avr-mini-project-archive.js
          node --check public/uart.js
          node --check public/ui-controls.js
          node --check public/sw.js
          node --check frontend/markdown-runtime/src/index.js
          node --check frontend/markdown-runtime/scripts/build.mjs

      - name: Check deployment shell scripts
        run: |
          for script in backend/deploy/*.sh; do bash -n "$script"; done

      - name: Check deployment helper syntax
        run: |
          python3 -m py_compile .github/scripts/stamp_frontend_build.py backend/deploy/install-materials.py
          python3 .github/scripts/stamp_frontend_build.py --check

      - name: Check generated diff hygiene
        run: git diff --check

  browser:
    name: Desktop browser interactions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/browser-tests/package-lock.json

      - name: Install browser tests
        run: npm ci --prefix frontend/browser-tests --ignore-scripts

      - name: Install Chromium
        run: npx --prefix frontend/browser-tests playwright install --with-deps chromium

      - name: Verify desktop window gestures
        run: npm test --prefix frontend/browser-tests
