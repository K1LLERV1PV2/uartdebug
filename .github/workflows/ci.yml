name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/markdown-runtime/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend --ignore-scripts

      - name: Install Markdown runtime dependencies
        run: npm ci --prefix frontend/markdown-runtime --ignore-scripts

      - name: Run tests
        run: npm test --prefix backend

      - name: Test vendored Markdown runtime
        run: |
          npm run build:check --prefix frontend/markdown-runtime
          npm test --prefix frontend/markdown-runtime

      - name: Check JavaScript syntax
        run: |
          npm run check --prefix backend
          node --check public/AVR-Programming.js
          node --check public/avr-mini-projects.js
          node --check public/avr-mini-project-archive.js
          node --check public/uart.js
          node --check public/ui-controls.js
          node --check public/sw.js
          node --check frontend/markdown-runtime/src/index.js
          node --check frontend/markdown-runtime/scripts/build.mjs

      - name: Check deployment shell scripts
        run: |
          for script in backend/deploy/*.sh; do bash -n "$script"; done

      - name: Verify local AVR knowledge manifest
        run: |
          node scripts/avr-knowledge/build-manifest.js --verify
          python3 scripts/avr-knowledge/snapshot.py --verify

      - name: Check deployment helper syntax
        run: python3 -m py_compile .github/scripts/stamp_frontend_build.py scripts/avr-knowledge/snapshot.py scripts/avr-knowledge/compare-installed.py scripts/avr-knowledge/extract-reference.py

      - name: Check generated diff hygiene
        run: git diff --check
