name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci --prefix backend --ignore-scripts

      - name: Run tests
        run: npm test --prefix backend

      - name: Check JavaScript syntax
        run: |
          npm run check --prefix backend
          node --check public/AVR-Programming.js
          node --check public/avr-mini-projects.js
          node --check public/avr-mini-project-archive.js
          node --check public/uart.js
          node --check public/sw.js

      - name: Check deployment shell scripts
        run: bash -n backend/deploy/*.sh

      - name: Check deployment helper syntax
        run: python3 -m py_compile .github/scripts/stamp_frontend_build.py

      - name: Check generated diff hygiene
        run: git diff --check
