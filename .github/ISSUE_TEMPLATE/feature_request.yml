name: Feature request
description: Propose an improvement to Uart Debug
title: "[Feature]: "
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UART Terminal
        - AVR Programming
        - Mini-projects and guides
        - AI assistant
        - Compiler or deployment
        - Repository and documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the user need or limitation, not only the proposed implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain how the feature should work from the user's perspective.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and constraints
      description: Include browser, hardware, compatibility, cost, or security considerations.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched for an existing issue or pull request.
          required: true
        - label: This request contains no credentials or private data.
          required: true
