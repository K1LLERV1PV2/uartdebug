# BEGIN uartdebug-ai-oauth-callback
# OAuth authorization codes and state values are query parameters. Keep this
# exact route out of the ordinary access log while retaining normal error logs.
location = /api/avr/ai/auth/google/callback {
    access_log off;
    include /etc/nginx/snippets/uartdebug-security-headers.conf;
    limit_conn uartdebug_conn_per_ip 2;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_pass http://127.0.0.1:8083;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
}
# END uartdebug-ai-oauth-callback
