# Keep this location before the broader `location ^~ /api/avr/` block.
location ^~ /api/avr/ai/ {
    include /etc/nginx/snippets/uartdebug-security-headers.conf;
    client_max_body_size 384k;
    limit_req zone=uartdebug_ai_per_ip burst=5 nodelay;
    limit_conn uartdebug_conn_per_ip 2;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_pass http://127.0.0.1:8083;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 165s;
}
