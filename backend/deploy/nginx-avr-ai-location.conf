# Keep this location before the broader `location ^~ /api/avr/` block.
location ^~ /api/avr/ai/ {
    include /etc/nginx/snippets/uartdebug-security-headers.conf;
    # Account file snapshots are capped at 4 MiB by the Node service. The small
    # margin covers the revision envelope while keeping nginx bounded.
    client_max_body_size 5m;
    limit_conn uartdebug_conn_per_ip 2;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_pass http://127.0.0.1:8083;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    # The non-streaming path can perform three token counts, three bounded model
    # calls, and three compiler checks before returning the verified project.
    proxy_read_timeout 1200s;
}
